services:
  - type: web
    name: prabhanjan-php-host-bot
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: UPDATE_CHANNEL
        sync: false
      - key: YOUR_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
